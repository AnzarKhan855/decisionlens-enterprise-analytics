name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test & Quality Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/app

      - name: Execute Pytest Suite with Coverage
        env:
          JWT_SECRET: "ci-testing-secret-token-32-chars-min"
          OTP_SECRET: "ci-testing-otp-secret-32-chars-min"
          SUPER_ADMIN_EMAIL: "admin@decisionlens.io"
          SUPER_ADMIN_PASSWORD: "ci-testing-password-123"
          DATABASE_URL: "sqlite:///./test_decisionlens.db"
          MONGODB_URL: "mongodb://localhost:27017/test_decisionlens"
          PYTHONPATH: "backend"
        run: |
          pytest backend/tests/test_workspace_business_logic.py backend/tests/test_security_hardening.py --tb=short

  frontend-check:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000/api/v1"
